# Ollodan only — use when Caddy (or nginx) already runs on the host.
# Image must exist locally: docker load < ollodan-image.tar.gz
#
#   docker compose -f docker-compose.app-only.yml up -d

services:
  ollodan:
    image: ollodan:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5210:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Data Source=/data/ollodan.db
    volumes:
      - ollodan-data:/data

volumes:
  ollodan-data:
